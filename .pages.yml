# Edit this website without HTML at https://app.pagescms.org/
media:
  - name: photos
    label: Photos
    input: media
    output: /media
    categories: [image]
  - name: documents
    label: Documents and CV
    input: media
    output: /media
    categories: [document]
  - name: videos_upload
    label: Videos (optional small MP4 files)
    input: media/videos
    output: /media/videos
    categories: [video]
content:
  - name: profile
    label: Homepage, about and contact
    type: file
    path: data/profile.json
    format: json
    fields:
      - { name: full_name, label: Full name, type: string, required: true }
      - { name: eyebrow, label: Homepage small heading, type: string }
      - { name: headline, label: Research field, type: string }
      - { name: intro, label: Homepage introduction, type: text }
      - { name: credential, label: Qualification caption, type: string }
      - { name: institution, label: Institution caption, type: string }
      - { name: about_heading, label: About page heading, type: string }
      - { name: about_paragraphs, label: About biography paragraphs, type: text, list: true }
      - { name: research_interests, label: Research interest tags, type: string, list: true }
      - { name: email, label: Public email, type: string }
      - { name: orcid, label: ORCID link, type: string }
      - { name: google_scholar, label: Google Scholar link, type: string }
      - { name: linkedin, label: LinkedIn link, type: string }
      - { name: portrait, label: Portrait photo, type: image, options: { media: photos } }
      - { name: cv_file, label: CV PDF, type: file, options: { media: documents } }
  - name: publications
    label: Publications
    type: file
    path: data/publications.json
    format: json
    list: true
    fields:
      - { name: year, label: Year, type: string }
      - { name: kind, label: Publication type, type: string }
      - { name: journal, label: Journal or venue, type: string }
      - { name: title, label: Title, type: text, required: true }
      - { name: authors, label: Authors, type: text }
      - { name: url, label: DOI or web URL, type: string }
  - name: research
    label: Research projects
    type: file
    path: data/research.json
    format: json
    list: true
    fields:
      - { name: category, label: Research category, type: string }
      - { name: title, label: Title, type: string, required: true }
      - { name: summary, label: Research summary, type: text }
      - { name: highlight, label: Key outcome, type: text }
  - name: education
    label: Education
    type: file
    path: data/education.json
    format: json
    list: true
    fields:
      - { name: year, label: Year, type: string }
      - { name: degree, label: Degree, type: string, required: true }
      - { name: institution, label: Institution, type: string }
      - { name: details, label: Details, type: text }
  - name: teaching
    label: Teaching and supervision
    type: file
    path: data/teaching.json
    format: json
    list: true
    fields:
      - { name: category, label: Category, type: string }
      - { name: title, label: Title, type: string, required: true }
      - { name: description, label: Description, type: text }
  - name: videos
    label: Videos — add or remove
    type: file
    path: data/videos.json
    format: json
    list: true
    fields:
      - { name: title, label: Video title, type: string, required: true }
      - { name: category, label: Category, type: string }
      - { name: year, label: Year, type: string }
      - { name: description, label: Description, type: text }
      - { name: video_url, label: YouTube link or MP4 path, type: string }
      - { name: thumbnail, label: Optional preview image, type: image, options: { media: photos } }
  - name: tech
    label: Tech Blog
    type: collection
    path: _tech
    format: yaml-frontmatter
    filename: '{primary}.md'
    fields:
      - { name: title, label: Blog title, type: string, required: true }
      - { name: date, label: Publication date, type: date, required: true }
      - { name: category, label: Category, type: string }
      - { name: summary, label: Short description, type: text }
      - { name: image, label: Featured image, type: image, options: { media: photos } }
      - { name: body, label: Article content, type: rich-text }
        - name: tech
    label: Tech Blog
    type: collection
    path: _tech
    format: yaml-frontmatter
    filename:
      template: "{primary}.md"
      field: create
    view:
      primary: title
      fields: [title, date, category]
      sort: date
      order: desc
    fields:
      - name: title
        label: Blog title
        type: string
        required: true
      - name: date
        label: Publication date
        type: date
        required: true
      - name: category
        label: Category
        type: string
      - name: summary
        label: Short description
        type: text
      - name: image
        label: Featured image
        type: image
        options:
          media: photos
      - name: body
        label: Article content
        type: rich-text
        options:
          format: markdown
          media: photos
          switcher: true
