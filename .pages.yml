# GitHub Pages content editor: https://app.pagescms.org/
# Store this file at the repository root, named exactly .pages.yml
media:
  - name: photos
    label: Photos
    input: media
    output: /media
    categories: [image]
  - name: documents
    label: CVs and documents
    input: media
    output: /media
    categories: [document]
content:
  - name: profile
    label: Home page, photo and contact
    type: file
    path: data/profile.json
    format: json
    fields:
      - { name: full_name, label: Full name, type: string, required: true }
      - { name: eyebrow, label: Small heading, type: string }
      - { name: headline, label: Academic field, type: string }
      - { name: intro, label: Short homepage introduction, type: text }
      - { name: credential, label: Degree caption, type: string }
      - { name: institution, label: University caption, type: string }
      - { name: about_heading, label: About heading, type: string }
      - { name: about_paragraphs, label: About paragraphs, type: text, list: true }
      - { name: research_interests, label: Research interest tags, type: string, list: true }
      - { name: email, label: Public email, type: string }
      - { name: orcid, label: ORCID link, type: string }
      - { name: google_scholar, label: Google Scholar link, type: string }
      - { name: linkedin, label: LinkedIn link, type: string }
      - { name: portrait, label: Profile photo, type: image, options: { media: photos } }
      - { name: cv_file, label: Academic CV PDF, type: file, options: { media: documents } }
  - name: publications
    label: Publications — add or remove
    type: file
    path: data/publications.json
    format: json
    list: true
    fields:
      - { name: year, label: Publication year, type: string }
      - { name: kind, label: Publication type, type: string }
      - { name: journal, label: Journal or venue, type: string }
      - { name: title, label: Title, type: text, required: true }
      - { name: authors, label: Authors, type: text }
      - { name: url, label: DOI or website link, type: string }
  - name: research
    label: Research areas — add or remove
    type: file
    path: data/research.json
    format: json
    list: true
    fields:
      - { name: category, label: Category, type: string }
      - { name: title, label: Title, type: string, required: true }
      - { name: summary, label: Summary, type: text }
      - { name: highlight, label: Highlight or key finding, type: text }
  - name: education
    label: Education — add or remove
    type: file
    path: data/education.json
    format: json
    list: true
    fields:
      - { name: year, label: Year and qualification, type: string }
      - { name: degree, label: Degree or qualification, type: string, required: true }
      - { name: institution, label: University or institution, type: string }
      - { name: details, label: Additional details, type: text }
  - name: teaching
    label: Teaching and mentorship — add or remove
    type: file
    path: data/teaching.json
    format: json
    list: true
    fields:
      - { name: category, label: Category or date, type: string }
      - { name: title, label: Course or activity title, type: string, required: true }
      - { name: description, label: Description, type: text }
